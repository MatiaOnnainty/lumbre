<!-- Textura de grano para userChrome.css.
     Intensidad: cambiá opacity del <rect> (0.04 muy suave … 0.12 marcado).
     Tamaño del grano: baseFrequency (más alto = grano más fino). -->
<svg xmlns="http://www.w3.org/2000/svg" width="180" height="180" viewBox="0 0 180 180">
  <filter id="grain" x="0" y="0" width="100%" height="100%">
    <feTurbulence type="fractalNoise" baseFrequency="0.9" numOctaves="3" stitchTiles="stitch"/>
    <feColorMatrix type="saturate" values="0"/>
  </filter>
  <rect width="100%" height="100%" filter="url(#grain)" opacity="0.07"/>
</svg>
